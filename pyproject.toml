[project]
name = "etymo"
version = "0.1.0"
description = "EtymoGraph data pipeline: kaikki/Wiktionary etymologies to clean tables, Neo4j and RDF"
authors = [
    { name = "vikaloeldar", email = "336925073+vikaloeldar@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etymo"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 flag "confusable" letters (Cyrillic с, ezh ʒ, ...). Multilingual words are our data.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["etymo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
