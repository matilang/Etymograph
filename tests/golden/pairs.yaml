# 4 ---------------------------------------------------------------------------
- id: bank-homographs
  kind: homograph
  words:
    - word: de:Bank#1
      gloss: bench
      ety_id: bench
      path:
        - [de:Bank#1, inh, goh:banc]
        - [goh:banc, inh, gmw-pro:*banki]       # chain step (inferred from "from X, from Y")
        - [gmw-pro:*banki, inh, gem-pro:*bankiz]
    - word: de:Bank#2
      gloss: financial institution
      ety_id: institution
      path:
        - [de:Bank#2, der, it:banco]
        - [de:Bank#2, der, it:banca]
        - [de:Bank#2, der, fr:banque]           # weak: prose says only a variant form was influenced
  expected_v1: >
    two separate word nodes; Bank#2 must not reach gem-pro:*bankiz,
    and Bank#1 must not reach it:banco / it:banca / fr:banque
  checked: en.wiktionary.org (wikitext), 2026-11-23
  notes: >
    Bank#1: MHG is named without a form ({{inh|de|gmh|-}}, NO_TERM), so the path
    starts at goh:banc. {{m|goh|bank||height}} and {{cog|osx|bank}} are not links.
    Bank#2: links come from {{etymon|de|id=institution|:der|it:banco|it:banca}};
    {{der|de|it|banco, banca}} is MULTI_TERM (no link). {{der|de|fr|banque}} gives a
    der link although the prose says "under influence of" (template and meaning
    disagree). Etymology 2 says the Italian words come from goh bank (etymology 1),
    so both Banks are truly related, but only via an {{m+}} mention and unloaded
    Italian: v1 correctly keeps them apart.

# 5 ---------------------------------------------------------------------------
- id: bank-bank
  kind: pair
  relation: related
  a: de:Bank#2
  b: pl:bank
  common_ancestor: null                   # disputed between the pages, see notes
  expected_v1: not_connected
  path_a:
    - [de:Bank#2, der, it:banco]          # it not loaded: no_file stub
    - [de:Bank#2, der, it:banca]          # it not loaded: no_file stub
  path_b:
    - [pl:bank, der, lng:bank]            # lng not loaded: no_file stub
  checked: en.wiktionary.org (wikitext), 2026-11-23
  notes: >
    Related in reality, but en.wiktionary disagrees on the route:
    (1) the Polish page names only {{der|pl|lng|bank}} (Lombardic);
    (2) the German page traces Italian banco/banca to goh bank, and its Descendants
    list has {{desc|bor=1|pl|bank}} (Polish borrowed from German).
    Descendants sections are not read, so (2) gives no link. Both sides end at
    no_file stubs on different nodes, so v1 cannot connect them.
    On the Polish page, {{cog|en|bank}}, {{cog|fr|banque}}, {{cog|de|Bank}} are
    cognates, {{dercat|pl|gmw-pro|gem-pro|ine-pro}} is categories only, and the
    Brückner reference (via Italian banco from German Bank) is a citation, not a link.
    Missing-data case, not a pipeline error.

