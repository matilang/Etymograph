  b: pl:ksiądz
  common_ancestor: gem-pro:*kuningaz
  expected_v1: not_connected
  path_a:
    - [de:König, inh, gmh:künec]
    - [gmh:künec, inh, goh:kuning]
    - [goh:kuning, inh, gmw-pro:*kuning]
    - [gmw-pro:*kuning, inh, gem-pro:*kuningaz]
  path_b:
    - [pl:ksiądz, inh, zlw-opl:ksiądz]
    # v1 stops here: zlw-opl:ksiądz = *kъnędzь + dominus (morphology template,
    # COMPOSED_OF, not loaded). The truth continues via the stem:
    # - [zlw-opl:ksiądz, inh, sla-pro:*kъnędzь]
    # - [sla-pro:*kъnędzь, der, gem-pro:*kuningaz]
  checked: en.wiktionary.org, 2026-11-23
  notes: >
    Related: German inherited the word through the full Germanic chain; Proto-Slavic
    *kъnędzь was taken from Germanic *kuningaz. Not connected in v1: Old Polish
    ksiądz is formed from *kъnędzь + dominus, a morphology step (COMPOSED_OF, not
    loaded), so the Polish path ends at the entry zlw-opl:ksiądz. Also a big
    meaning change (king vs priest).

